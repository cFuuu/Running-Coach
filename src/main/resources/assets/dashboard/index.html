<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Running Coach 訓練儀表板</title>
  <!-- 不引用任何 CDN：離線與區網皆可運作，個人資料不外流 -->
  <link rel="stylesheet" href="styles.css">
  <!--
    在首次繪製前就套用主題，避免「先閃一下淺色再變深色」的 FOUC。
    這是本專案唯一允許的 inline script（其餘邏輯一律在 app.js）。
    讀寫的 localStorage key 與 theme.js 的 THEME_STORAGE_KEY 必須一致。
  -->
  <script>
    (function () {
      'use strict';
      try {
        var raw = localStorage.getItem('rc-dashboard-settings');
        var pref = raw ? (JSON.parse(raw).theme || 'system') : 'system';
        var resolved = pref === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : pref;
        document.documentElement.setAttribute('data-theme', resolved);
      } catch (e) {
        // localStorage 不可用或內容損毀：維持預設（淺色），不阻塞頁面載入
      }
    })();
  </script>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <h1 class="site-title">訓練儀表板</h1>
      <div class="meta-info" id="meta-info"></div>
      <!--
        range 按鈕由 app.js 依 /api/meta 回傳的 ranges 動態產生（後端
        RANGE_LABELS 是唯一真實來源），不在 HTML 寫死——避免這裡、
        app.js、後端三處各自維護一份清單而漂移。
      -->
      <div class="range-switch" role="group" aria-label="時間區間切換" id="range-switch"></div>
      <div class="custom-range" id="custom-range">
        <button type="button" class="range-btn" id="custom-range-toggle" aria-expanded="false">自訂區間</button>
        <div class="custom-range-panel" id="custom-range-panel" hidden>
          <label class="custom-range-field">
            起
            <input type="date" id="custom-range-start">
          </label>
          <label class="custom-range-field">
            訖
            <input type="date" id="custom-range-end">
          </label>
          <button type="button" class="custom-range-apply" id="custom-range-apply">套用</button>
        </div>
      </div>
      <div class="theme-switch" role="group" aria-label="主題切換">
        <button type="button" class="theme-btn" data-theme-choice="light" aria-pressed="false" title="淺色">☀</button>
        <button type="button" class="theme-btn" data-theme-choice="dark" aria-pressed="false" title="深色">🌙</button>
        <button type="button" class="theme-btn" data-theme-choice="system" aria-pressed="true" title="跟隨系統">🖥</button>
      </div>
    </div>
  </header>

  <div class="notice-bar" id="notice-bar"></div>

  <!--
    導覽列：五個錨點按鈕，跳轉到下方對應區塊（不做 tab，仍是單頁）。
    連結由 app.js 依 SECTION_NAV 常數產生 is-active 高亮，這裡先放好
    固定的 5 個錨點與 aria-label，內容（is-active class）由 JS 接手。
  -->
  <nav class="section-nav" aria-label="區塊導覽" id="section-nav">
    <div class="section-nav-inner">
      <a class="section-nav-link" href="#panel-today" data-nav-target="panel-today">今日</a>
      <a class="section-nav-link" href="#panel-calendar" data-nav-target="panel-calendar">本週與行事曆</a>
      <a class="section-nav-link" href="#panel-session" data-nav-target="panel-session">單場分析</a>
      <a class="section-nav-link" href="#panel-load" data-nav-target="panel-load">訓練負荷與趨勢</a>
      <a class="section-nav-link" href="#panel-wellness" data-nav-target="panel-wellness">每日身體狀況</a>
    </div>
  </nav>

  <!--
    版面：
      手機（<768px）單欄堆疊，DOM 順序＝顯示順序：
        今日 → 本週與行事曆 → 單場分析 → 訓練負荷與趨勢 → 每日身體狀況
      桌機（≥768px）今日卡橫跨兩欄置頂；其下左欄＝單場分析(上)+訓練負荷與趨勢(下)，
      右欄＝本週與行事曆(上)+每日身體狀況(下)
  -->
  <main class="layout">

    <!-- 區塊一：今日（桌機橫跨兩欄，見 .panel-today 樣式） -->
    <section class="panel panel-today" id="panel-today" aria-labelledby="h-today">
      <h2 class="panel-title" id="h-today">
        今日<span class="panel-hint">規則引擎輸出的事實與信賴度，不含判讀建議</span>
      </h2>
      <div id="today-body"></div>
    </section>

    <div class="col-left">

      <!-- 區塊三：單場分析 -->
      <section class="panel" id="panel-session" aria-labelledby="h-session">
        <h2 class="panel-title" id="h-session">
          單場分析<span class="panel-hint">預設為區間內最近一場，可切換</span>
        </h2>

        <div id="session-picker"></div>

        <div id="session-body">
          <div id="session-summary"></div>

          <div class="chart-block">
            <h3 class="chart-title">每公里分圈配速</h3>
            <div id="lap-chart"></div>
          </div>

          <div class="chart-block">
            <h3 class="chart-title">配速／心率逐秒曲線</h3>
            <div id="records-chart"></div>
          </div>

          <div class="chart-block">
            <h3 class="chart-title">心率漂移（前半段 vs 後半段）</h3>
            <div id="hr-drift"></div>
          </div>

          <div class="chart-block">
            <h3 class="chart-title">心率區間分布</h3>
            <div id="hrzone-chart"></div>
          </div>

          <div class="chart-block">
            <h3 class="chart-title">隔天恢復影響</h3>
            <div id="recovery-impact"></div>
          </div>
        </div>
      </section>

      <!-- 區塊四：訓練負荷與趨勢（原「跨場次趨勢」＋新增負荷曲線） -->
      <section class="panel" id="panel-load" aria-labelledby="h-load">
        <h2 class="panel-title" id="h-load">訓練負荷與趨勢</h2>
        <div id="load-chart"></div>
        <div id="trend-charts"></div>
        <div id="session-list"></div>
      </section>

    </div>

    <div class="col-right">

      <!-- 區塊二：本週與行事曆 -->
      <section class="panel" id="panel-calendar" aria-labelledby="h-calendar">
        <h2 class="panel-title" id="h-calendar">本週與行事曆</h2>
        <div id="week-strip"></div>
        <button type="button" class="calendar-toggle" id="calendar-toggle" aria-expanded="false">展開月曆 ▾</button>
        <div id="calendar-body" hidden></div>
        <div class="calendar-legend" id="calendar-legend"></div>
      </section>

      <!-- 區塊五：每日身體狀況 -->
      <section class="panel" id="panel-wellness" aria-labelledby="h-wellness">
        <h2 class="panel-title" id="h-wellness">
          每日身體狀況<span class="panel-hint">淡色背景為訓練日</span>
        </h2>
        <div class="legend">
          <span class="legend-item"><span class="swatch swatch-training"></span><span>訓練日</span></span>
        </div>
        <div id="wellness-charts"></div>
      </section>

    </div>

  </main>

  <footer class="site-footer">
    圖表僅呈現數據與趨勢，不含任何解讀或建議。
  </footer>

  <!--
    開發用假資料（DEV ONLY，內容為虛構）已於 2026-09-08 停止預設載入——
    後端 /api/* 已接上真實資料庫，預設一律走真實 API。
    檔案 mock-data.js 保留備用（前端改版、或無資料庫環境要 demo 時）：
    在網址加 ?mock=1 即會動態載入並改走假資料。
  -->
  <script>
    // ?mock=1 時才把 mock-data.js 插進來。用 document.write 是為了保持同步載入
    // ——app.js 在頂層就讀 window.MOCK_API 判定要不要走假資料，非同步載入會來不及。
    if (new URLSearchParams(window.location.search).get('mock') === '1') {
      document.write('<script src="mock-data.js"><\/script>');
    }
  </script>

  <script src="theme.js"></script>
  <script src="charts.js"></script>
  <script src="app.js"></script>
</body>
</html>
