[project]
name = "running-coach"
version = "0.1.0"
# 3.12.16 為安全性更新，最低版本不得低於此；<3.13 避免跨小版本無預警升級
requires-python = ">=3.12.16,<3.13"
# 只列直接依賴；版本由 uv.lock 鎖定（單一事實來源）。
# 資料庫用 Python 內建的 sqlite3，測試用內建的 unittest，皆無需額外安裝。
dependencies = [
    # Anthropic API（Phase 3 / Dashboard D.3：AI 教練聊天面板的後端對話迴圈）
    # 金鑰只從環境變數 ANTHROPIC_API_KEY 讀，永不進版控（見 CLAUDE.md §🔐）。
    "anthropic>=1.4.0",
    # Web API 與本機 dashboard 伺服器
    "fastapi>=0.141.0",
    # Garmin FIT 檔解析（逐秒心率/配速/GPS、每公里分圈）
    "fitparse>=1.2.0",
    # Garmin Connect API 存取（Phase 1B 增量同步匯入器）
    # curl_cffi 為其依賴會自動帶入，用於在 TLS 層模擬官方 Android app 指紋——
    # Garmin 自 2026-03 起以 Cloudflare TLS 指紋辨識封鎖一般 HTTP client。
    # ⚠️ 不要加入 garth：已於 2026-03-28 deprecated，且 0.3.11 起已完全移除該依賴。
    "garminconnect>=0.3.11",
    # FastAPI 的 TestClient 需要 httpx（src/test/unit/test_routes_chat.py 要用）。
    # Starlette 偵測到 httpx2 時會優先用它（anthropic 會帶入），沒有才退回這個；
    # 兩條路徑都可行，此處列出保底的那個。
    "httpx>=0.28.0",
    # MCP server（把 Phase 1 資料查詢 + Phase 2 規則引擎包成 AI 可呼叫的 tools）
    # 鎖 <3：v1→v2 曾有重大改版（FastMCP 移除，改用 MCPServer），避免未來 v3 無預警破壞相容性
    "mcp[cli]>=2.0.0,<3",
    "uvicorn>=0.52.0",
]
